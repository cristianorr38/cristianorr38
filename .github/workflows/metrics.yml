name: Metrics
on:
  schedule:
    - cron: "0 * * * *" # Atualiza a cada hora
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cristianorr38
          template: classic
          base: header, languages, activity, repositories, stars, followers, lines
          config_timezone: America/Sao_Paulo
          filename: metrics.svg
